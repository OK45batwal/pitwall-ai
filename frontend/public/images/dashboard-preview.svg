  <text x="260" y="562" fill="#fbbf24" font-size="13" font-weight="600">⚠️ Pit Window Opening — Lap 26</text>
  <text x="260" y="584" fill="#94a3b8" font-size="12">Medium tire degradation detected on top 3 cars.</text>
  <text x="260" y="604" fill="#94a3b8" font-size="12">Recommendation: Switch to Hard compound for final stint.</text>
  <text x="260" y="630" fill="#94a3b8" font-size="12">Expected undercut delta: +1.8s for Norris over Verstappen.</text>

  <!-- Over/Undercut buttons -->
  <rect x="260" y="650" width="90" height="26" rx="4" fill="#1e40af" stroke="#3b82f6" stroke-width="1"/>
  <text x="305" y="668" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Undercut</text>
  <rect x="360" y="650" width="90" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="405" y="668" text-anchor="middle" fill="#94a3b8" font-size="11">Overcut</text>
  <rect x="460" y="650" width="90" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="505" y="668" text-anchor="middle" fill="#94a3b8" font-size="11">Simulate</text>

  <!-- === Right Panel — Track Map === -->
  <rect x="720" y="140" width="450" height="350" rx="10" fill="url(#glow)" stroke="#1e293b" stroke-width="1"/>
  <text x="745" y="168" fill="#94a3b8" font-size="11">TRACK MAP</text>

  <!-- Track (simplified Sakhir layout) -->
  <!-- Bahrain circuit shape -->
  <path d="M890 200 Q850 200 830 230 Q810 260 820 290 Q830 310 850 320 Q870 330 880 350 Q890 380 910 400 Q940 420 970 410 Q990 400 1000 380 Q1010 360 1000 340 Q990 320 970 310 Q950 300 940 280 Q930 260 930 240 Q930 210 910 200 Z" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M890 200 Q850 200 830 230 Q810 260 820 290 Q830 310 850 320 Q870 330 880 350 Q890 380 910 400 Q940 420 970 410 Q990 400 1000 380 Q1010 360 1000 340 Q990 320 970 310 Q950 300 940 280 Q930 260 930 240 Q930 210 910 200 Z" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Start/Finish line -->
  <line x1="880" y1="195" x2="885" y2="205" stroke="#fff" stroke-width="2"/>

  <!-- Car positions on track -->
  <circle cx="920" cy="240" r="5" fill="#ff8000"/><text x="926" y="245" fill="#ff8000" font-size="8">NOR</text>
  <circle cx="890" cy="280" r="5" fill="#0600ef"/><text x="896" y="285" fill="#0600ef" font-size="8">VER</text>
  <circle cx="960" cy="370" r="5" fill="#006f62"/><text x="966" y="375" fill="#006f62" font-size="8">LEC</text>
  <circle cx="1000" cy="340" r="5" fill="#0090ff"/><text x="1006" y="345" fill="#0090ff" font-size="8">RUS</text>
  <circle cx="850" cy="310" r="5" fill="#ff8000"/><text x="856" y="315" fill="#ff8000" font-size="8">PIA</text>
  <circle cx="840" cy="250" r="5" fill="#52c252"/><text x="846" y="255" fill="#52c252" font-size="8">HAM</text>

  <!-- Legend -->
  <text x="745" y="440" fill="#64748b" font-size="10">● Position · ● Pit (6 cars shown)</text>

  <!-- Tire degradation mini chart -->
  <rect x="720" y="460" width="450" height="80" rx="10" fill="url(#glow)" stroke="#1e293b" stroke-width="1"/>
  <text x="745" y="485" fill="#64748b" font-size="11">TIRE DEGRADATION</text>

  <!-- Chart bars -->
  <rect x="760" y="500" width="30" height="30" rx="3" fill="#ff8000" opacity="0.8"/>
  <text x="775" y="544" text-anchor="middle" fill="#94a3b8" font-size="9">NOR</text>
  <rect x="805" y="510" width="30" height="20" rx="3" fill="#0600ef" opacity="0.8"/>
  <text x="820" y="544" text-anchor="middle" fill="#94a3b8" font-size="9">VER</text>
  <rect x="850" y="495" width="30" height="35" rx="3" fill="#006f62" opacity="0.8"/>
  <text x="865" y="544" text-anchor="middle" fill="#94a3b8" font-size="9">LEC</text>
  <rect x="895" y="520" width="30" height="10" rx="3" fill="#0090ff" opacity="0.8"/>
  <text x="910" y="544" text-anchor="middle" fill="#94a3b8" font-size="9">RUS</text>
  <rect x="940" y="505" width="30" height="25" rx="3" fill="#ff8000" opacity="0.5"/>
  <text x="955" y="544" text-anchor="middle" fill="#94a3b8" font-size="9">PIA</text>

  <text x="1000" y="525" fill="#64748b" font-size="9">% wear →</text>

  <!-- Predictions pill -->
  <rect x="720" y="555" width="220" height="35" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="740" y="578" fill="#a78bfa" font-size="12" font-weight="600">AI Winner Prediction</text>
  <text x="940" y="578" fill="#e2e8f0" font-size="12">NOR 43% · VER 31%</text>

  <!-- Timer -->
  <rect x="955" y="555" width="215" height="35" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="975" y="578" fill="#94a3b8" font-size="12">Next update in 3.2s</text>

  <!-- Bottom bar -->
  <rect x="0" y="720" width="1200" height="30" fill="#0f172a"/>
  <line x1="0" y1="720" x2="1200" y2="720" stroke="#1e293b" stroke-width="1"/>
  <text x="25" y="740" fill="#475569" font-size="10">OpenF1 API · Connected</text>
  <text x="450" y="740" fill="#475569" font-size="10">Redis · Connected</text>
  <text x="820" y="740" fill="#475569" font-size="10">PostgreSQL · Connected</text>
  <text x="1100" y="740" fill="#475569" font-size="10">v1.0.0</text>
