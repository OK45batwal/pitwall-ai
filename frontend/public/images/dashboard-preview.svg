    <text x="46" y="199" fill="#94a3b8" font-size="12">Drivers</text>
    <text x="46" y="233" fill="#94a3b8" font-size="12">Teams</text>
    <text x="46" y="267" fill="#94a3b8" font-size="12">Strategy</text>
    <text x="46" y="301" fill="#94a3b8" font-size="12">AI Center</text>
    <text x="46" y="335" fill="#94a3b8" font-size="12">History</text>
    <text x="46" y="369" fill="#94a3b8" font-size="12">Weather</text>
  </g>

  <!-- Data source -->
  <rect x="12" y="420" width="176" height="44" rx="6" fill="rgba(255,135,0,0.05)" stroke="rgba(255,135,0,0.1)" stroke-width="1"/>
  <text x="24" y="438" fill="#ff8700" font-size="8" font-weight="700" letter-spacing="2">DATA SOURCE</text>
  <text x="24" y="454" fill="#e2e8f0" font-size="11" font-weight="600">OpenF1 API</text>

  <!-- === Session Bar === -->
