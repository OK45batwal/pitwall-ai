  <text x="430" y="360" fill="#64748b" font-size="10">Ferrari</text>
  <text x="510" y="360" fill="#00b8ff" font-size="11" font-family="JetBrains Mono">+0.892s</text>
  <text x="760" y="360" fill="#64748b" font-size="11">+4.103s</text>

  <!-- Row 4 -->
