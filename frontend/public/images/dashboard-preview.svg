  <text x="510" y="396" fill="#00b8ff" font-size="11" font-family="JetBrains Mono">+0.445s</text>
  <text x="760" y="396" fill="#64748b" font-size="11">+5.872s</text>

  <!-- Row 5 -->
  <line x1="236" y1="408" x2="824" y2="408" stroke="rgba(148,163,184,0.08)" stroke-width="0.5"/>
