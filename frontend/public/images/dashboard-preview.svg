  <text x="787" y="93" fill="#e2e8f0" font-size="13" font-weight="700">1:32.847</text>
  <text x="857" y="93" fill="#64748b" font-size="9">VER · L18</text>

  <rect x="960" y="65" width="200" height="32" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
  <text x="972" y="78" fill="#64748b" font-size="10">GAP P1 → P2</text>
  <text x="972" y="93" fill="#e2e8f0" font-size="13" font-weight="700">+2.341s</text>

  <!-- === Stat cards row === -->
  <rect x="220" y="118" width="228" height="52" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.05)" stroke-width="1"/>
  <text x="238" y="138" fill="#64748b" font-size="9" font-weight="700" letter-spacing="2">DRIVERS</text>
  <text x="238" y="158" fill="#e2e8f0" font-size="22" font-weight="900">20</text>
  <text x="280" y="158" fill="#64748b" font-size="10">on track</text>

  <rect x="460" y="118" width="228" height="52" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.05)" stroke-width="1"/>
