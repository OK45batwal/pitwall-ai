  <text x="252" y="288" fill="#ffb800" font-size="13" font-weight="800">P1</text>
  <rect x="278" y="277" width="10" height="10" rx="5" fill="#ff8000"/>
  <text x="296" y="288" fill="#e2e8f0" font-size="13" font-weight="700">L. Norris</text>
  <text x="430" y="288" fill="#64748b" font-size="10">McLaren Mercedes</text>
  <text x="510" y="288" fill="#64748b" font-size="11">—</text>
  <text x="760" y="288" fill="#00da7a" font-size="11" font-weight="700">Leader</text>

