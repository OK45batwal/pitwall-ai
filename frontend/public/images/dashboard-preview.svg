  </defs>

  <rect width="1200" height="750" fill="url(#bg)" rx="12"/>
  <rect x="1" y="1" width="1198" height="748" rx="11" fill="none" stroke="rgba(148,163,184,0.1)" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="28" cy="22" r="5" fill="#e8002d"/>
  <circle cx="46" cy="22" r="5" fill="#ffb800"/>
  <circle cx="64" cy="22" r="5" fill="#00da7a"/>

  <!-- === Sidebar === -->
  <rect x="0" y="40" width="200" height="710" fill="#06080f"/>
  <line x1="200" y1="40" x2="200" y2="750" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>

  <rect x="16" y="58" width="28" height="28" rx="6" fill="#ff8700"/>
