  <rect x="510" y="65" width="12" height="12" rx="6" fill="#00da7a"/>
  <rect x="510" y="65" width="12" height="12" rx="6" fill="#00da7a" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0;0.4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="transform" type="scale" values="1;2;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="530" y="77" fill="#00da7a" font-size="11" font-weight="700">LIVE</text>
  <text x="530" y="97" fill="#64748b" font-size="10">Lap 24/57</text>

  <rect x="590" y="65" width="170" height="32" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
  <text x="602" y="78" fill="#64748b" font-size="10">LEADER</text>
  <text x="602" y="93" fill="#e2e8f0" font-size="13" font-weight="700">L. NORRIS</text>
  <text x="682" y="93" fill="#64748b" font-size="9">MCL</text>

  <rect x="775" y="65" width="170" height="32" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
