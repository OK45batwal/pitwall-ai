<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect width="1200" height="750" fill="url(#bg)" rx="16"/>
  <rect x="1" y="1" width="1198" height="748" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Window controls -->
  <circle cx="30" cy="25" r="6" fill="#ef4444"/>
  <circle cx="52" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="74" cy="25" r="6" fill="#22c55e"/>
  <text x="600" y="30" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">PitWall AI — Dashboard</text>

  <!-- === Sidebar === -->
  <rect x="0" y="45" width="220" height="705" fill="#0f172a"/>
  <line x1="220" y1="45" x2="220" y2="750" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="62" width="32" height="32" rx="8" fill="#3b82f6"/>
  <text x="36" y="83" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">P</text>
  <text x="65" y="83" fill="#e2e8f0" font-size="16" font-weight="700">PitWall AI</text>

  <!-- Nav items -->
