  <text x="878" y="224" fill="#64748b" font-size="10">Sakhir International Circuit</text>

  <!-- Bahrain circuit -->
  <path d="M1020 270 Q980 260 960 280 Q940 300 950 320 Q960 335 980 340 Q1000 345 1010 360 Q1020 380 1040 395 Q1070 410 1095 400 Q1110 390 1120 370 Q1130 350 1120 330 Q1110 315 1090 310 Q1070 305 1060 290 Q1050 275 1050 260 Q1050 255 1020 270 Z" fill="none" stroke="#1e293b" stroke-width="5"/>
  <path d="M1020 270 Q980 260 960 280 Q940 300 950 320 Q960 335 980 340 Q1000 345 1010 360 Q1020 380 1040 395 Q1070 410 1095 400 Q1110 390 1120 370 Q1130 350 1120 330 Q1110 315 1090 310 Q1070 305 1060 290 Q1050 275 1050 260 Q1050 255 1020 270 Z" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="1010" y1="265" x2="1015" y2="275" stroke="#fff" stroke-width="1.5"/>

  <!-- Car dots -->
  <circle cx="1050" cy="285" r="4" fill="#ff8000"/>
  <text x="1055" y="290" fill="#ff8000" font-size="7">NOR</text>
  <circle cx="1010" cy="320" r="4" fill="#0600ef"/>
  <text x="1015" y="325" fill="#0600ef" font-size="7">VER</text>
  <circle cx="940" cy="310" r="4" fill="#dc0000"/>
  <text x="945" y="315" fill="#dc0000" font-size="7">LEC</text>
  <circle cx="1080" cy="385" r="4" fill="#00d2be"/>
  <text x="1085" y="390" fill="#00d2be" font-size="7">RUS</text>
  <circle cx="1120" cy="350" r="4" fill="#ff8000"/>
  <text x="1125" y="355" fill="#ff8000" font-size="7">PIA</text>
  <circle cx="975" cy="345" r="4" fill="#00da7a"/>
  <text x="980" y="350" fill="#00da7a" font-size="7">HAM</text>

  <!-- === Strategy Panel === -->
  <rect x="220" y="515" width="620" height="120" rx="8" fill="url(#card)" stroke="rgba(255,184,0,0.15)" stroke-width="1"/>
  <text x="238" y="540" fill="#ffb800" font-size="11" font-weight="700">STRATEGY RECOMMENDATION</text>
  <text x="238" y="562" fill="#64748b" font-size="11">Pit window opening — Lap 26. Medium tire degradation detected on top 3 cars.</text>
  <text x="238" y="580" fill="#64748b" font-size="11">Recommendation: Switch to Hard compound for final stint.</text>
  <text x="238" y="598" fill="#64748b" font-size="11">Expected undercut delta: +1.8s for Norris over Verstappen.</text>

  <rect x="238" y="615" width="85" height="24" rx="4" fill="#ff8700"/>
  <text x="280" y="632" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">Undercut</text>
  <rect x="332" y="615" width="85" height="24" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(148,163,184,0.1)" stroke-width="1"/>
  <text x="374" y="632" text-anchor="middle" fill="#94a3b8" font-size="10">Overcut</text>
  <rect x="426" y="615" width="85" height="24" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(148,163,184,0.1)" stroke-width="1"/>
  <text x="468" y="632" text-anchor="middle" fill="#94a3b8" font-size="10">Simulate</text>

  <!-- Win prob + Tire -->
  <rect x="860" y="515" width="150" height="120" rx="8" fill="url(#card)" stroke="rgba(148,163,184,0.1)" stroke-width="1"/>
  <text x="878" y="540" fill="#94a3b8" font-size="9" font-weight="700" letter-spacing="2">WIN PROBABILITY</text>
  <circle cx="920" cy="590" r="4" fill="#ff8000"/><text x="932" y="594" fill="#e2e8f0" font-size="11">NOR 43%</text>
  <circle cx="920" cy="610" r="4" fill="#0600ef"/><text x="932" y="614" fill="#e2e8f0" font-size="11">VER 31%</text>
  <circle cx="920" cy="630" r="4" fill="#dc0000"/><text x="932" y="634" fill="#e2e8f0" font-size="11">LEC 18%</text>

  <rect x="1020" y="515" width="160" height="55" rx="8" fill="url(#card)" stroke="rgba(148,163,184,0.1)" stroke-width="1"/>
  <text x="1038" y="538" fill="#94a3b8" font-size="9" font-weight="700" letter-spacing="2">TIRE DEGRADATION</text>
  <rect x="1040" y="548" width="20" height="14" rx="2" fill="#e8002d" opacity="0.7"/>
  <text x="1050" y="564" text-anchor="middle" fill="#64748b" font-size="7">S</text>
  <rect x="1068" y="552" width="20" height="10" rx="2" fill="#ffb800" opacity="0.7"/>
  <text x="1078" y="564" text-anchor="middle" fill="#64748b" font-size="7">M</text>
  <rect x="1096" y="556" width="20" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <text x="1106" y="564" text-anchor="middle" fill="#64748b" font-size="7">H</text>

  <!-- === Bottom Bar === -->
  <rect x="0" y="720" width="1200" height="30" fill="#06080f"/>
  <line x1="0" y1="720" x2="1200" y2="720" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
  <text x="220" y="740" fill="#475569" font-size="9">OpenF1 · Connected</text>
  <text x="500" y="740" fill="#475569" font-size="9">PostgreSQL · Connected</text>
  <text x="780" y="740" fill="#475569" font-size="9">Redis · Connected</text>
