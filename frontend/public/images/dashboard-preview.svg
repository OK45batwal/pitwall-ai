  <text x="430" y="468" fill="#64748b" font-size="10">Ferrari</text>
  <text x="510" y="468" fill="#00b8ff" font-size="11" font-family="JetBrains Mono">+0.678s</text>
  <text x="760" y="468" fill="#64748b" font-size="11">+8.450s</text>

