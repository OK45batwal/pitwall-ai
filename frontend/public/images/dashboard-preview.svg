  <text x="40" y="143" fill="#3b82f6" font-size="13">Dashboard</text>

  <g opacity="0.5">
    <rect x="12" y="164" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="187" fill="#94a3b8" font-size="13">Live Race</text>
    <rect x="12" y="208" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="231" fill="#94a3b8" font-size="13">Drivers</text>
    <rect x="12" y="252" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="275" fill="#94a3b8" font-size="13">Teams</text>
    <rect x="12" y="296" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="319" fill="#94a3b8" font-size="13">Strategy</text>
    <rect x="12" y="340" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="363" fill="#94a3b8" font-size="13">AI Predictions</text>
    <rect x="12" y="384" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="407" fill="#94a3b8" font-size="13">History</text>
    <rect x="12" y="428" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="451" fill="#94a3b8" font-size="13">Weather</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="492" x2="200" y2="492" stroke="#1e293b" stroke-width="1"/>

  <g opacity="0.4">
    <rect x="12" y="508" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="531" fill="#94a3b8" font-size="13">Settings</text>
    <rect x="12" y="552" width="196" height="36" rx="6" fill="none"/>
    <text x="40" y="575" fill="#94a3b8" font-size="13">Profile</text>
  </g>

  <!-- === Main Content === -->
  <rect x="240" y="60" width="350" height="140" rx="10" fill="url(#glow)" stroke="#1e293b" stroke-width="1"/>
  <text x="260" y="88" fill="#94a3b8" font-size="11">CURRENT SESSION</text>
  <text x="260" y="112" fill="#e2e8f0" font-size="20" font-weight="700">2025 Bahrain Grand Prix</text>
  <text x="260" y="135" fill="#64748b" font-size="13">Round 4 · Sakhir International Circuit</text>
  <!-- Status badge -->
  <rect x="260" y="150" width="72" height="22" rx="11" fill="#065f46"/>
  <circle cx="277" cy="161" r="4" fill="#22c55e"/>
  <text x="287" y="166" fill="#6ee7b7" font-size="11" font-weight="600">LIVE</text>
  <!-- Lap counter -->
  <rect x="345" y="150" width="60" height="22" rx="11" fill="#1e293b"/>
  <text x="363" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">Lap 24/57</text>

  <!-- Quick Stats -->
  <rect x="610" y="60" width="170" height="65" rx="10" fill="url(#glow)" stroke="#1e293b" stroke-width="1"/>
  <text x="630" y="85" fill="#64748b" font-size="11">LEADER</text>
  <text x="630" y="107" fill="#e2e8f0" font-size="16" font-weight="700">L. NORRIS</text>
  <text x="630" y="118" fill="#64748b" font-size="10">McLaren Mercedes</text>

  <rect x="795" y="60" width="170" height="65" rx="10" fill="url(#glow)" stroke="#1e293b" stroke-width="1"/>
  <text x="815" y="85" fill="#64748b" font-size="11">FASTEST LAP</text>
  <text x="815" y="107" fill="#e2e8f0" font-size="16" font-weight="700">1:32.847</text>
  <text x="815" y="118" fill="#64748b" font-size="10">M. Verstappen · Lap 18</text>

  <rect x="980" y="60" width="190" height="65" rx="10" fill="url(#glow)" stroke="#1e293b" stroke-width="1"/>
  <text x="1000" y="85" fill="#64748b" font-size="11">GAP P1 → P2</text>
  <text x="1000" y="107" fill="#e2e8f0" font-size="16" font-weight="700">+2.341s</text>
  <text x="1000" y="118" fill="#64748b" font-size="10">Norris → Verstappen</text>

  <!-- === Race Standings Table === -->
  <text x="260" y="236" fill="#e2e8f0" font-size="14" font-weight="700">Race Standings</text>
  <rect x="240" y="250" width="460" height="240" rx="10" fill="url(#glow)" stroke="#1e293b" stroke-width="1"/>

  <!-- Table header -->
  <rect x="250" y="258" width="440" height="28" rx="4" fill="#1e293b"/>
  <text x="267" y="277" fill="#64748b" font-size="10" font-weight="600">POS</text>
  <text x="310" y="277" fill="#64748b" font-size="10" font-weight="600">DRIVER</text>
  <text x="480" y="277" fill="#64748b" font-size="10" font-weight="600">TEAM</text>
  <text x="570" y="277" fill="#64748b" font-size="10" font-weight="600">GAP</text>
  <text x="630" y="277" fill="#64748b" font-size="10" font-weight="600">STATUS</text>
  <line x1="250" y1="288" x2="690" y2="288" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="267" y="310" fill="#22c55e" font-size="12" font-weight="700">P1</text>
  <circle cx="312" cy="307" r="5" fill="#ff8000"/>
  <text x="326" y="311" fill="#e2e8f0" font-size="12">L. Norris</text>
  <text x="480" y="311" fill="#94a3b8" font-size="11">McLaren Mercedes</text>
  <text x="570" y="311" fill="#e2e8f0" font-size="12">—</text>
  <text x="630" y="311" fill="#22c55e" font-size="11">Racing</text>

  <!-- Row 2 -->
  <line x1="250" y1="320" x2="690" y2="320" stroke="#1e293b" stroke-width="0.5"/>
  <text x="267" y="336" fill="#94a3b8" font-size="12" font-weight="600">P2</text>
  <circle cx="312" cy="333" r="5" fill="#0600ef"/>
  <text x="326" y="337" fill="#e2e8f0" font-size="12">M. Verstappen</text>
  <text x="480" y="337" fill="#94a3b8" font-size="11">Red Bull Honda</text>
  <text x="570" y="337" fill="#e2e8f0" font-size="12">+2.341s</text>
  <text x="630" y="337" fill="#22c55e" font-size="11">Racing</text>

  <!-- Row 3 -->
  <line x1="250" y1="346" x2="690" y2="346" stroke="#1e293b" stroke-width="0.5"/>
  <text x="267" y="362" fill="#94a3b8" font-size="12" font-weight="600">P3</text>
  <circle cx="312" cy="359" r="5" fill="#006f62"/>
  <text x="326" y="363" fill="#e2e8f0" font-size="12">C. Leclerc</text>
  <text x="480" y="363" fill="#94a3b8" font-size="11">Ferrari</text>
  <text x="570" y="363" fill="#e2e8f0" font-size="12">+4.103s</text>
  <text x="630" y="363" fill="#22c55e" font-size="11">Racing</text>

  <!-- Row 4 -->
  <line x1="250" y1="372" x2="690" y2="372" stroke="#1e293b" stroke-width="0.5"/>
  <text x="267" y="388" fill="#94a3b8" font-size="12" font-weight="600">P4</text>
  <circle cx="312" cy="385" r="5" fill="#0090ff"/>
  <text x="326" y="389" fill="#e2e8f0" font-size="12">G. Russell</text>
  <text x="480" y="389" fill="#94a3b8" font-size="11">Mercedes</text>
  <text x="570" y="389" fill="#e2e8f0" font-size="12">+5.872s</text>
  <text x="630" y="389" fill="#22c55e" font-size="11">Racing</text>

  <!-- Row 5 -->
  <line x1="250" y1="398" x2="690" y2="398" stroke="#1e293b" stroke-width="0.5"/>
  <text x="267" y="414" fill="#94a3b8" font-size="12" font-weight="600">P5</text>
  <circle cx="312" cy="411" r="5" fill="#ff8000"/>
  <text x="326" y="415" fill="#e2e8f0" font-size="12">O. Piastri</text>
  <text x="480" y="415" fill="#94a3b8" font-size="11">McLaren Mercedes</text>
  <text x="570" y="415" fill="#e2e8f0" font-size="12">+7.214s</text>
  <text x="630" y="415" fill="#22c55e" font-size="11">Racing</text>

  <!-- Row 6 -->
  <line x1="250" y1="424" x2="690" y2="424" stroke="#1e293b" stroke-width="0.5"/>
  <text x="267" y="440" fill="#94a3b8" font-size="12" font-weight="600">P6</text>
  <circle cx="312" cy="437" r="5" fill="#52c252"/>
  <text x="326" y="441" fill="#e2e8f0" font-size="12">L. Hamilton</text>
  <text x="480" y="441" fill="#94a3b8" font-size="11">Ferrari</text>
  <text x="570" y="441" fill="#e2e8f0" font-size="12">+8.450s</text>
  <text x="630" y="441" fill="#22c55e" font-size="11">Racing</text>

