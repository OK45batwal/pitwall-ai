  <text x="252" y="432" fill="#94a3b8" font-size="13" font-weight="700">P5</text>
  <rect x="278" y="421" width="10" height="10" rx="5" fill="#ff8000"/>
  <text x="296" y="432" fill="#e2e8f0" font-size="13">O. Piastri</text>
  <text x="430" y="432" fill="#64748b" font-size="10">McLaren Mercedes</text>
  <text x="510" y="432" fill="#00b8ff" font-size="11" font-family="JetBrains Mono">+1.102s</text>
  <text x="760" y="432" fill="#64748b" font-size="11">+7.214s</text>

  <!-- Row 6 -->
  <line x1="236" y1="444" x2="824" y2="444" stroke="rgba(148,163,184,0.08)" stroke-width="0.5"/>
