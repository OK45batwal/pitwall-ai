  <text x="478" y="158" fill="#e2e8f0" font-size="22" font-weight="900">42°C</text>
  <text x="550" y="158" fill="#64748b" font-size="10">temperature</text>

  <rect x="700" y="118" width="228" height="52" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.05)" stroke-width="1"/>
  <text x="718" y="138" fill="#64748b" font-size="9" font-weight="700" letter-spacing="2">AIR</text>
  <text x="718" y="158" fill="#e2e8f0" font-size="22" font-weight="900">28°C</text>
  <text x="790" y="158" fill="#64748b" font-size="10">ambient</text>

  <rect x="940" y="118" width="240" height="52" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.05)" stroke-width="1"/>
  <text x="958" y="138" fill="#64748b" font-size="9" font-weight="700" letter-spacing="2">WIND</text>
  <text x="958" y="158" fill="#e2e8f0" font-size="22" font-weight="900">12 km/h</text>
  <text x="1040" y="158" fill="#64748b" font-size="10">55% humidity</text>

