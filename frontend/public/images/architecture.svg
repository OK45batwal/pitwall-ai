<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0l10 5-10 5Z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="580" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">PitWall AI — System Architecture</text>
  <line x1="160" y1="48" x2="740" y2="48" stroke="#334155" stroke-width="1"/>

  <!-- Trust zone: Frontend -->
  <rect x="30" y="65" width="270" height="490" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="40" y="88" fill="#60a5fa" font-size="12" font-weight="600">CLIENT TIER</text>

  <!-- Trust zone: Backend -->
  <rect x="320" y="65" width="270" height="490" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="330" y="88" fill="#a78bfa" font-size="12" font-weight="600">API TIER</text>

  <!-- Trust zone: Infra -->
  <rect x="610" y="65" width="260" height="490" rx="8" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="620" y="88" fill="#34d399" font-size="12" font-weight="600">DATA TIER</text>

  <!-- === CLIENT TIER BOXES === -->

  <!-- Next.js App -->
  <rect x="50" y="105" width="230" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="165" y="130" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Next.js 15 Frontend</text>
  <text x="165" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">App Router · React 19 · TypeScript</text>

  <!-- Pages -->
  <rect x="50" y="180" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="105" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">Dashboard</text>

  <rect x="170" y="180" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="225" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">Live Race</text>

  <rect x="50" y="230" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="105" y="255" text-anchor="middle" fill="#e2e8f0" font-size="11">Driver Analytics</text>

  <rect x="170" y="230" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="225" y="255" text-anchor="middle" fill="#e2e8f0" font-size="11">Strategy Sim</text>

  <rect x="50" y="280" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="105" y="305" text-anchor="middle" fill="#e2e8f0" font-size="11">AI Predictions</text>

  <rect x="170" y="280" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="225" y="305" text-anchor="middle" fill="#e2e8f0" font-size="11">Race History</text>

  <!-- Components label -->
  <rect x="50" y="340" width="230" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="165" y="360" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Components</text>
  <text x="165" y="378" text-anchor="middle" fill="#94a3b8" font-size="10">3D Track · Telemetry Charts · Lap Timeline</text>

  <!-- 3D badge -->
  <rect x="50" y="405" width="230" height="30" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="165" y="424" text-anchor="middle" fill="#fbbf24" font-size="11">Three.js · Recharts · Tailwind CSS</text>

  <!-- Connection line client→server -->
  <line x1="280" y1="200" x2="320" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="250" x2="320" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="240" text-anchor="middle" fill="#64748b" font-size="10">REST</text>

  <!-- === API TIER BOXES === -->

  <!-- FastAPI -->
  <rect x="340" y="105" width="230" height="60" rx="6" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="455" y="130" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">FastAPI Server</text>
  <text x="455" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">Uvicorn · REST + WebSocket</text>

  <!-- Auth -->
  <rect x="340" y="180" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="395" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">JWT Auth</text>

  <rect x="460" y="180" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="515" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">Rate Limiter</text>

  <!-- Endpoints -->
  <rect x="340" y="230" width="230" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="455" y="250" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">REST Endpoints</text>
  <text x="455" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">/predictions · /strategy · /telemetry · /auth</text>

  <!-- WebSocket -->
  <rect x="340" y="295" width="230" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="455" y="318" text-anchor="middle" fill="#34d399" font-size="11">WebSocket · Live Telemetry Stream</text>

  <!-- Services -->
  <rect x="340" y="350" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="395" y="375" text-anchor="middle" fill="#e2e8f0" font-size="11">Prediction Engine</text>

  <rect x="460" y="350" width="110" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="515" y="375" text-anchor="middle" fill="#e2e8f0" font-size="11">Strategy Service</text>

  <!-- OpenF1 gateway -->
  <rect x="340" y="405" width="230" height="30" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="455" y="424" text-anchor="middle" fill="#fbbf24" font-size="11">OpenF1 Gateway · External API</text>

  <!-- Connection server→data -->
  <line x1="570" y1="200" x2="610" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="300" x2="610" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="240" text-anchor="middle" fill="#64748b" font-size="10">async</text>

  <!-- === DATA TIER BOXES === -->

  <!-- PostgreSQL -->
  <rect x="630" y="105" width="220" height="80" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="740" y="135" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">PostgreSQL</text>
  <text x="740" y="155" text-anchor="middle" fill="#94a3b8" font-size="10">Drivers · Teams · Races</text>
  <text x="740" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">Telemetry · Predictions</text>

  <!-- Redis -->
  <rect x="630" y="200" width="220" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="740" y="228" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">Redis Cache</text>
  <text x="740" y="245" text-anchor="middle" fill="#94a3b8" font-size="10">Session Cache · Rate Limiter</text>

  <!-- Docker -->
  <rect x="630" y="275" width="220" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="740" y="303" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Docker Compose</text>
  <text x="740" y="320" text-anchor="middle" fill="#94a3b8" font-size="10">PostgreSQL + Redis</text>

  <!-- ML models box -->
  <rect x="630" y="350" width="220" height="85" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="740" y="378" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">ML Models</text>
  <text x="740" y="396" text-anchor="middle" fill="#94a3b8" font-size="10">Winner Prediction</text>
  <text x="740" y="412" text-anchor="middle" fill="#94a3b8" font-size="10">Tire Wear · Safety Car · Strategy</text>

  <!-- Connection ML→data -->
  <line x1="740" y1="435" x2="740" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Datasets -->
  <rect x="660" y="470" width="160" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="740" y="495" text-anchor="middle" fill="#94a3b8" font-size="11">Mock Data · CSV Datasets</text>

  <!-- Legend -->
  <rect x="30" y="530" width="840" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="45" y="540" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="62" y="550" fill="#94a3b8" font-size="10">Client Tier</text>
  <rect x="145" y="540" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="162" y="550" fill="#94a3b8" font-size="10">API Tier</text>
  <rect x="235" y="540" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="252" y="550" fill="#94a3b8" font-size="10">Data Tier</text>
  <rect x="335" y="540" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="352" y="550" fill="#94a3b8" font-size="10">External/Integration</text>
  <rect x="485" y="540" width="12" height="12" rx="2" fill="#a855f7"/>
  <text x="502" y="550" fill="#94a3b8" font-size="10">ML Pipeline</text>
  <text x="750" y="550" fill="#64748b" font-size="10">Next.js 15 + FastAPI + PostgreSQL + Redis</text>
</svg>
